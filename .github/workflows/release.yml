name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    # 仅构建 Windows 平台：当前启动器以便携版为主，未配置 linux/macos 桌面目录。
    # 后续若新增平台支持，恢复 matrix 配置并在项目根目录执行
    # `flutter create --platforms=linux,macos .` 即可。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../../BAMCLaunch-windows.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: BAMCLaunch-windows
          path: BAMCLaunch-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: BAMCLaunch-*/BAMCLaunch-*
